<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- MENU HTML -->
<div th:unless="${session.currentUser}">
    <script>
        window.location.href = '/';
    </script>
</div>
<div th:if="${session.currentUser}">
<div class="navigation">
    <div>
        <ul>
            <li><b>Olsker Cupcakes |</b></li>
            <li><a href="/">Forside</a></li>
            <li th:if="${session.currentUser}">
                <a href="/order">Bestil</a>
                <a href="/profile">Min Profil</a>
                <a href="/cart">Vis indkøbskurv</a>
            </li>
            <li th:unless="${session.currentUser}">
                <a href="/login">Bestil</a>
            </li>
            <li th:if="${session.currentUser != null and session.currentUser.administrator}">
                <a href="/admin">Admin</a></li>
        </ul>
    </div>
    <div th:if="${session.currentUser}">
        <span th:text ="${session.currentUser.username}"></span> |
        <a href="/logout">Log ud</a>
    </div>
    <div th:unless="${session.currentUser}">
        <a>Ikke logget ind -</a>
        <a href="/login">Log ind</a>
    </div>
</div>
<!-- MENU HTML -->

<hr>
<br>

<div class="userinfo">
<h1>Min Profil</h1>
<p><strong>Email:</strong>
    <span th:text ="${session.currentUser.username}"></span> |
</p>

<p><strong>Saldo:</strong>
    <span th:text="${session.currentUser.balance}"></span>
</p>
</div>
<hr>
    <h2>Ordrer</h2>
    <table class="admin-orders">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>User ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Cupcake</th>
            <th>Antal</th>
            <th>Total pris</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="Order : ${getAllOrders}">

            <!-- ORDER -->
            <tr class="order-row">
                <td th:text="${Order.orderId}"></td>
                <td th:text="${Order.userId}"></td>
                <td th:text="${Order.date}"></td>
                <td th:text="${Order.status}"></td>

                <td></td>
                <td></td>
                <td></td>
            </tr>

            <!-- ORDERLINES -->
            <th:block th:each="line : ${getAllOrderlines}">
                <tr th:if="${line.orderId == Order.orderId}" class="orderline-row">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>

                    <td th:text="${line.cupcakeName}"></td>
                    <td th:text="${line.amount}"></td>
                    <td th:text="${line.totalPrice}"></td>
                </tr>
            </th:block>

        </th:block>
        </tbody>
    </table>
</body>
</html>

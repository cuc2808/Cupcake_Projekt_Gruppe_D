<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>orderpage</title>
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- MENU HTML -->
<div th:unless="${session.currentUser}">
    <script>
        window.location.href = '/';
    </script>
</div>
<div class="navigation">
    <div>
        <ul>
            <li><b>Olsker Cupcakes |</b></li>
            <li><a href="/">Forside</a></li>
            <li th:if="${session.currentUser}">
                <a href="/order">Bestil</a>
                <a href="/profile">Min Profil</a>
                <a href="/cart">Vis indkøbskurv</a>
            </li>
            <li th:unless="${session.currentUser}">
                <a href="/login">Bestil</a>
            </li>
            <li th:if="${session.currentUser != null and session.currentUser.administrator}">
                <a href="/admin">Admin</a></li>
        </ul>
    </div>
    <div th:if="${session.currentUser}">
        <span th:text ="${session.currentUser.username}"></span> |
        <a href="/logout">Log ud</a>
    </div>
    <div th:unless="${session.currentUser}">
        <a>Ikke logget ind -</a>
        <a href="/login">Log ind</a>
    </div>
</div>
<!-- MENU HTML -->

<hr>

<h1>Bestil cupcakes</h1>
<p>Vælg en bund og topping, angiv antal og læg i kurven.</p>
<hr>

<form action="/add_to_cart" method="post">

    <h3>Vælg Top</h3>
    <div th:each="top : ${tops}">
        <input type="radio" name="topselect" th:value="${top.topId}" required>
        <span th:text="${top.topName}"></span>
        <span th:text="${top.description}"></span>
        <span th:text="${top.price}"></span> kr
    </div>

    <h3>Vælg Bund</h3>
    <div th:each="bottom : ${bottoms}">
        <input type="radio" name="bottomselect" th:value="${bottom.bottomId}" required>
        <span th:text="${bottom.bottomName}"></span>
        <span th:text="${bottom.description}"></span>
        <span th:text="${bottom.price}"></span> kr
    </div>

    <br>
    <label for="amount">Antal</label>
    <input type="number" id="amount" name="amount" value="1" min="1" max="99" required>

    <button type="submit">Læg i kurv</button>

</form>
</body>
</html>

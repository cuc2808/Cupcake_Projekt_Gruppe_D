<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<!-- MENU HTML -->
<div th:unless="${session.currentUser && session.currentUser.administrator}">
    <script>
        window.location.href = '/';
    </script>
</div>
<div th:if="${session.currentUser && session.currentUser.administrator}">
<div class="navigation">
    <div>
        <ul>
            <li><b>Olsker Cupcakes |</b></li>
            <li><a href="/">Forside</a></li>
            <li th:if="${session.currentUser}">
                <a href="/order">Bestil</a>
                <a href="/profile">Min Profil</a>
                <a href="/cart">Vis indkøbskurv</a>
            </li>
            <li th:unless="${session.currentUser}">
                <a href="/login">Bestil</a>
            </li>
            <li th:if="${session.currentUser != null and session.currentUser.administrator}">
                <a href="/admin">Admin</a></li>
        </ul>
    </div>
    <div th:if="${session.currentUser}">
        <span th:text="${session.currentUser.username}"></span> |
        <a href="/logout">Log ud</a>
    </div>
    <div th:unless="${session.currentUser}">
        <a>Ikke logget ind -</a>
        <a href="/login">Log ind</a>
    </div>
</div>
<!-- MENU HTML -->
<hr>
<br>

<h1>Admin</h1>
<p>Her kan du se alle odrer og kunder</p>
<hr>

<h2>Ordrer</h2>
<table class="admin-orders">
    <thead>
    <tr>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Date</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="Order : ${getAllOrders}">
        <td th:text="${Order.orderId}"></td>
        <td th:text="${Order.userId}"></td>
        <td th:text="${Order.date}"></td>
        <td th:text="${Order.status}"></td>
    </tr>
    </tbody>
</table>
<hr>
<br>

<h2>Brugere</h2>
<table class="admin-users">
    <thead>
    <tr>
        <th>User ID</th>
        <th>Email</th>
        <th>Balance</th>
        <th>Admin</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="User : ${getAllUsers}">
        <td th:text="${User.userId}">#000</td>
        <td th:text="${User.username}">null</td>

        <td colspan="4">
            <form method="post" action="/updateUser" style="display: flex; justify-content: space-between;">
                <input type="hidden" name="userId" th:value="${User.userId}">

                <input type="number" step="10.0" min="0.0" name="balance" th:value="${User.balance}">

                <select name="administrator">
                    <option value="true" th:selected="${User.administrator}">Ja</option>
                    <option value="false" th:selected="${!User.administrator}">Nej</option>
                </select>

                <button type="submit">Opdater</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
